<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ofertas | Vitrine Certa</title><style>body{margin:0;background:#f6f7fb;color:#1b2540;font:15px system-ui}header{background:#111729;color:white;padding:24px 5%;display:flex;justify-content:space-between;align-items:center}header a{color:#c7baff}main{max-width:1150px;margin:auto;padding:35px 5%}h1{font-size:28px}p{color:#758098}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.card{background:white;border:1px solid #e8eaf1;border-radius:17px;padding:16px}.card img{width:100%;height:185px;object-fit:contain}.card strong{display:block;margin:12px 0}.price{font-size:22px;font-weight:800}.btn,button{display:inline-block;border:0;background:#6654e9;color:white;text-decoration:none;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.notice{background:#f1efff;padding:15px;border-radius:12px;margin:20px 0}input{display:block;width:100%;padding:12px;border:1px solid #d9dfea;border-radius:9px;box-sizing:border-box;margin:7px 0 14px}form{max-width:550px}.hidden{display:none}</style></head><body><header><b>◆ VITRINE CERTA</b><nav><a href="/v2">Painel</a> · <a href="/ofertas">Vitrine</a></nav></header><main><h1>Ofertas selecionadas</h1><p>Produtos publicados com links de parceiros. Preços e disponibilidade devem ser confirmados na loja.</p><div class="notice">Transparência: podemos receber comissão por compras qualificadas feitas pelos links desta página.</div><div id="grid" class="grid"></div><p id="message" role="status"></p><details style="margin-top:45px"><summary><b>Gerenciar ofertas</b> — acesso restrito</summary><form id="form"><label>Token do painel<input id="token" type="password" autocomplete="off" required></label><label>Produto<input id="title" required maxlength="180"></label><label>Preço (R$)<input id="price" type="number" min=".01" step=".01" required></label><label>Link de afiliado HTTPS<input id="link" type="url" required></label><label>Imagem HTTPS (opcional)<input id="image" type="url"></label><label>Categoria<input id="category" value="geral"></label><label><input id="published" type="checkbox" style="display:inline;width:auto" checked> Publicar oferta</label><button type="submit">Salvar oferta</button><p id="feedback" role="status"></p></form><button id="manage">Consultar minhas ofertas</button><div id="managed"></div></details></main><script>const $=id=>document.getElementById(id);const make=(tag,value)=>{const e=document.createElement(tag);if(value!==undefined)e.textContent=value;return e};async function load(){try{const r=await fetch("/api/v2/manual-offers");const d=await r.json();if(!r.ok)throw Error(d.error);$("grid").replaceChildren();for(const p of d.offers||[]){const card=make("article");card.className="card";if(p.image_url){const img=make("img");img.src=p.image_url;img.loading="lazy";img.alt=p.title;card.append(img)}card.append(make("strong",p.title));const price=make("div",Number(p.price).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}));price.className="price";card.append(price);const a=make("a","Ver na loja");a.className="btn";a.href=p.affiliate_url;a.target="_blank";a.rel="sponsored noopener noreferrer";card.append(a);$("grid").append(card)}$("message").textContent=d.offers?.length?"":"Nenhuma oferta publicada ainda."}catch(e){$("message").textContent=e.message}}$("form").addEventListener("submit",async e=>{e.preventDefault();try{const r=await fetch("/api/v2/manual-offers",{method:"POST",headers:{"content-type":"application/json","x-dashboard-token":$("token").value},body:JSON.stringify({title:$("title").value,price:Number($("price").value),affiliateUrl:$("link").value,image:$("image").value,category:$("category").value,published:$("published").checked})});const d=await r.json();if(!r.ok)throw Error(d.error);$("feedback").textContent="Oferta salva. Verifique se seu link é comissionável.";load()}catch(e){$("feedback").textContent=e.message}});$("manage").addEventListener("click",async()=>{try{const r=await fetch("/api/v2/manual-offers/manage",{headers:{"x-dashboard-token":$("token").value}});const d=await r.json();if(!r.ok)throw Error(d.error);$("managed").replaceChildren();for(const p of d.offers){const line=make("p",p.title+" · "+(p.published?"Publicada":"Rascunho")+" ");const btn=make("button","Excluir");btn.onclick=async()=>{if(!confirm("Excluir esta oferta?"))return;const response=await fetch("/api/v2/manual-offers/"+p.id,{method:"DELETE",headers:{"x-dashboard-token":$("token").value}});if(response.ok){line.remove();load()}};line.append(btn);$("managed").append(line)}}catch(e){$("managed").textContent=e.message}});load();</script></body></html>
