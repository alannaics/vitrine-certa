<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111729"><title>Vitrine Certa — Ferramentas</title><link rel="stylesheet" href="/studio-shell.css?v=1"><style>body{margin:0;background:#f6f7fb}main{max-width:none;padding:0}.tools-intro{margin-bottom:22px}.tools-intro h1{font:800 clamp(27px,3vw,38px)/1.2 Manrope,sans-serif;letter-spacing:-1.5px;margin:0 0 10px}.tools-intro p{font:13px 'DM Sans',sans-serif;color:#818ba1;line-height:1.7}.tools-frame{width:100%;min-height:950px;border:1px solid #e9ecf3;border-radius:19px;background:#fff;display:block;box-shadow:0 14px 44px #202a540b}.tools-note{font:12px 'DM Sans',sans-serif;color:#818ba1;margin:15px 0}@media(max-width:800px){.tools-frame{min-height:1200px}}</style></head><body><main><div class="tools-intro"><h1>Seu estúdio de criação.</h1><p>Planejamento, conteúdos, campanhas e inteligência de afiliados reunidos no mesmo espaço.</p></div><iframe class="tools-frame" id="toolsFrame" title="Ferramentas de gestão e criação" src="/classic?embedded=1" loading="eager"></iframe><p class="tools-note">As ferramentas anteriores foram preservadas. Seus dados e ações continuam disponíveis.</p></main><script src="/studio-shell.js?v=1" defer></script><script>addEventListener("message",e=>{if(e.origin!==location.origin||e.data?.type!=="vc-tools-height")return;const h=Number(e.data.height);if(Number.isFinite(h)&&h>400&&h<30000)document.getElementById("toolsFrame").style.height=h+"px"})</script></body></html>
